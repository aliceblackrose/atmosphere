name: Build and test

on:
  push:
    branches: [main, "phase-*/**"]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          dotnet-version: "10.0.x"
      - name: Restore
        run: dotnet restore tests/Cirrova.Tests/Cirrova.Tests.csproj
      - name: Test and build
        run: dotnet test tests/Cirrova.Tests/Cirrova.Tests.csproj --configuration Release --no-restore
