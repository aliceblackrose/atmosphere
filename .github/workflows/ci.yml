name: Build and test

on:
  push:
    branches: [main, "phase-*/**"]
  pull_request:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      - name: Restore
        run: dotnet restore tests/Atmosphere.Tests/Atmosphere.Tests.csproj
      - name: Test and build
        run: dotnet test tests/Atmosphere.Tests/Atmosphere.Tests.csproj --configuration Release --no-restore
