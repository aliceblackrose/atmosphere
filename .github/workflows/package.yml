name: Package desktop preview

on:
  workflow_dispatch:
  push:
    branches: [main, "phase-*/**", "feature/**", "refactor/**"]
    tags: ["v*"]

permissions:
  contents: read

jobs:
  publish:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            rid: win-x64
          - os: ubuntu-latest
            rid: linux-x64
          - os: macos-latest
            rid: osx-arm64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          dotnet-version: "10.0.x"
      - name: Generate Windows icon in C#
        if: matrix.rid == 'win-x64'
        run: dotnet run --project tools/Atmosphere.IconTool/Atmosphere.IconTool.csproj --configuration Release -- create
      - name: Test
        run: dotnet test tests/Atmosphere.Tests/Atmosphere.Tests.csproj --configuration Release
      - name: Publish self-contained launcher
        shell: bash
        run: |
          dotnet publish src/Atmosphere/Atmosphere.csproj \
            --configuration Release \
            --runtime ${{ matrix.rid }} \
            --self-contained true \
            -p:PublishSingleFile=true \
            -p:IncludeNativeLibrariesForSelfExtract=true \
            -p:PublishTrimmed=false \
            -p:DebugType=None \
            --output "out/atmosphere-${{ matrix.rid }}"
      - name: Verify native Windows executable icon in C#
        if: matrix.rid == 'win-x64'
        run: dotnet run --project tools/Atmosphere.IconTool/Atmosphere.IconTool.csproj --configuration Release -- verify out/atmosphere-win-x64/Atmosphere.exe
      - name: Copy source icon for desktop shortcuts
        shell: bash
        run: |
          cp icon.png "out/atmosphere-${{ matrix.rid }}/Atmosphere.png"
      - name: Upload preview build
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: atmosphere-${{ matrix.rid }}
          path: out/atmosphere-${{ matrix.rid }}/
          if-no-files-found: error

  release:
    name: Publish downloadable GitHub Release
    # Feature branches and manual workflow runs keep using temporary Actions artifacts.
    # Every main push gets a preview; pushed v* tags become versioned releases.
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download successful platform builds
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: atmosphere-*
          path: release-bundles
      - name: Prepare standalone EXE, platform archives, and SHA-256 checksums
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          for rid in win-x64 linux-x64 osx-arm64; do
            test -d "release-bundles/atmosphere-$rid"
          done

          # Offer the Windows executable directly and a ZIP with all published files.
          test -f release-bundles/atmosphere-win-x64/Atmosphere.exe
          cp release-bundles/atmosphere-win-x64/Atmosphere.exe dist/Atmosphere.exe
          (cd release-bundles/atmosphere-win-x64 && zip -q -r "$GITHUB_WORKSPACE/dist/Atmosphere-win-x64.zip" .)

          # GitHub Actions artifacts do not preserve Unix executable permissions.
          for rid in linux-x64 osx-arm64; do
            test -f "release-bundles/atmosphere-$rid/Atmosphere"
            chmod +x "release-bundles/atmosphere-$rid/Atmosphere"
            tar -czf "dist/Atmosphere-$rid.tar.gz" -C "release-bundles/atmosphere-$rid" .
          done
          (cd dist && sha256sum Atmosphere* > SHA256SUMS.txt)

      - name: Create preview or versioned GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            # An explicit version tag creates a normal, stable release.
            gh release create "$GITHUB_REF_NAME" dist/* --repo "$GITHUB_REPOSITORY" \
              --verify-tag --title "$GITHUB_REF_NAME" --generate-notes
          else
            # Unique preview tags keep every successful main-branch build downloadable.
            tag="preview-$GITHUB_RUN_NUMBER"
            gh release create "$tag" dist/* --repo "$GITHUB_REPOSITORY" \
              --target "$GITHUB_SHA" --title "Atmosphere preview #$GITHUB_RUN_NUMBER" \
              --notes "Automated development preview from commit $GITHUB_SHA. Windows is the primary supported platform; manual game integration testing is still required." \
              --prerelease --latest=false
          fi
